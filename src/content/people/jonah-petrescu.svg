<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4800 480" width="4800" height="480" role="img">
  <!-- Staff portrait, one of a set of four. Same two-ink risograph
       construction as the locked homepage hero and social card: warm black
       #1e1810 and gold #b97d1c on cream #fbf6ed, with a bronze #8a5c13
       off-register ghost and a halftone clipped to the gold mass only. An
       abstract head-and-shoulders mark, not a likeness of a real person.

       The canvas is 10:1 so that every consumer shows the full 480 height:
       the People card (16:9, src x1973-2827), the 390px mobile hero
       (src x2140-2660) and the person hero from 1440 to 3600 wide. The
       figure therefore fills 86% of the card's height instead of the 42%
       a 3:1 canvas allowed.

       Brows, eyes, nose and mouth sit in y128-226. The person-page title
       reaches source y248 at the widths where it also reaches the face, so
       those marks stay clear of it; the chin, neck and shoulders fall behind
       it and are ghosted by the theme's stock scrim. -->
  <defs>
    <pattern id="halftone-jonah-petrescu" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="4.5" fill="#1e1810"/>
      <circle cx="20" cy="20" r="2.6" fill="#1e1810"/>
    </pattern>
    <path id="head-jonah-petrescu" d="M 2312 100 C 2326 66 2356 50 2400 50 C 2444 50 2474 66 2488 100 C 2502 134 2504 190 2492 222 C 2480 252 2444 262 2400 262 C 2356 262 2320 252 2308 222 C 2296 190 2298 134 2312 100 Z"/>
    <path id="crown-jonah-petrescu" d="M 2296 132 C 2300 78 2342 44 2400 44 C 2458 44 2500 78 2504 132 C 2474 116 2448 122 2428 134 L 2400 116 L 2372 134 C 2352 122 2326 116 2296 132 Z"/>
    <path id="shoulders-jonah-petrescu" d="M 2348 290 C 2270 296 2175 316 2097 366 C 2063 392 2045 422 2045 446 L 2755 446 C 2755 422 2737 392 2703 366 C 2625 316 2530 296 2452 290 Z"/>
    <clipPath id="clip-shoulders-jonah-petrescu"><use href="#shoulders-jonah-petrescu"/></clipPath>
  </defs>

  <rect width="4800" height="480" fill="#fbf6ed"/>

  <!-- off-register second pass, the bronze fringe of a riso print -->
  <g transform="translate(-8 7)" opacity="0.20" fill="#8a5c13">
    <use href="#shoulders-jonah-petrescu"/>
    <use href="#head-jonah-petrescu"/>
    <use href="#crown-jonah-petrescu"/>
  </g>

  <!-- neck, behind the shoulder mass -->
  <path d="M 2356 236 L 2444 236 L 2450 300 L 2350 300 Z" fill="#fffdf7" stroke="#1e1810" stroke-width="15"
    stroke-linejoin="round"/>

  <!-- shoulders: the bold gold mass, echoing the hero flap and card flap -->
  <use href="#shoulders-jonah-petrescu" fill="#b97d1c"/>
  <g clip-path="url(#clip-shoulders-jonah-petrescu)" opacity="0.18">
    <rect x="2000" y="280" width="800" height="180" fill="url(#halftone-jonah-petrescu)"/>
  </g>
  <use href="#shoulders-jonah-petrescu" fill="none" stroke="#1e1810" stroke-width="17"
    stroke-linejoin="round"/>
  <path d="M 2344 288 Q 2400 330 2456 288 L 2456 306 Q 2400 348 2344 306 Z" fill="#fffdf7" stroke="#1e1810" stroke-width="9" stroke-linejoin="round"/>

  <!-- head, in the same paper tone as the locked card's envelope face -->
  <use href="#head-jonah-petrescu" fill="#fffdf7" stroke="#1e1810" stroke-width="15"
    stroke-linejoin="round"/>
  <use href="#crown-jonah-petrescu" fill="#1e1810"/>
  

  <g fill="none" stroke="#1e1810" stroke-width="9" stroke-linecap="round"><rect x="2322" y="130" width="68" height="56" rx="15"/><rect x="2410" y="130" width="68" height="56" rx="15"/><path d="M 2390 156 L 2410 156"/><path d="M 2322 150 L 2304 144"/><path d="M 2478 150 L 2496 144"/></g><circle cx="2356" cy="158" r="9" fill="#1e1810"/><circle cx="2444" cy="158" r="9" fill="#1e1810"/><path d="M 2372 226 L 2428 226" stroke="#1e1810" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>
